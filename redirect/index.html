<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>Thrive has moved</title>
  <script>
    // Thrive moved to luketmoss/keel (luketmoss/keel#385). Map /thrive/<rest>
    // onto /keel/thrive/<rest>, keeping the query and the hash, and replace
    // so the old URL never enters history.
    (function () {
      var rest = location.pathname.replace(/^\/thrive(\/|$)/, '');
      var target = 'https://luketmoss.github.io/keel/thrive/' + rest + location.search + location.hash;
      location.replace(target);
      document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('open').href = target;
      });
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=https://luketmoss.github.io/keel/thrive/">
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: Canvas;
      color: CanvasText;
      padding: 0 16px;
    }
    main { max-width: 28rem; text-align: center; }
    h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
    p { margin: 0 0 1rem; line-height: 1.5; }
    a { color: LinkText; font-weight: 600; }
    .muted { opacity: 0.7; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Thrive has moved</h1>
    <p>It now lives at luketmoss.github.io/keel/thrive.</p>
    <p><a id="open" href="https://luketmoss.github.io/keel/thrive/">Open Thrive</a></p>
    <p class="muted">On your home screen? Add Thrive again from the new address.</p>
  </main>
</body>
</html>
