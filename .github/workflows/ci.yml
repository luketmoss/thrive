name: ci

# Every pull request, and every push to main. Deliberately *not* path-filtered:
# `/ship` refuses to merge a PR whose checks are absent, and a path-filtered
# workflow reports nothing at all on a PR that touches neither project — which
# reads as "no checks" and stalls the merge. The whole suite runs in well under
# a minute, so always running it is cheaper than the exception.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      # Run the typecheck as its own step so a type error reports as
      # "typecheck" rather than hiding inside "build" — `npm run build` is
      # `tsc --noEmit && vite build`, so this is a deliberate duplicate.
      - name: typecheck
        run: npx tsc --noEmit
      - run: npm run build

  mcp-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      - run: npm test

  # #130. Like the two above, deliberately not path-filtered.
  apps-script:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps-script
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps-script/package-lock.json
      - run: npm ci
      - run: npm test
      - name: typecheck
        run: npm run typecheck

  # #151. The COROS sync — like the others, deliberately not path-filtered.
  # node --test with fakes for COROS and Drive; no network, no secrets.
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sync/package-lock.json
      - run: npm ci
      - run: npm test
