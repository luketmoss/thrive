name: coros-sync-watchdog

# The dead-man's switch for coros-sync (#156, sync plan §10). A job that
# doesn't run cannot report itself, so this is a separate workflow on its own
# schedule. It fails, and Actions' failure email fires, when the newest SyncLog
# row is more than 16 hours old (sync/src/deadman.mjs says why 16).
#
# It cannot catch GitHub's scheduler stopping for the whole repo (the 60-day
# inactivity auto-disable on a public repo stops this workflow too). That layer
# is the Settings "last synced" line, #157.
on:
  # Every 3 hours at :47, clear of the sync's :17. Once tripped, it fails on
  # every run until a sync lands.
  schedule:
    - cron: '47 */3 * * *'
  workflow_dispatch:

# Deliberately not the coros-sync group: this only reads, and joining that
# group could cancel a pending sync run.
concurrency:
  group: coros-sync-watchdog
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: sync
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      # No npm ci: deadman.mjs imports only src/thrive-api.mjs and src/redact.mjs.
      - name: dead-man check
        run: node deadman.mjs
        env:
          THRIVE_API_URL: ${{ secrets.THRIVE_API_URL }}
          THRIVE_API_KEY: ${{ secrets.THRIVE_API_KEY }}
