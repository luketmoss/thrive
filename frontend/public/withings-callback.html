<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>Thrive: Withings sign-in</title>
<!--
  Withings' OAuth callback (#196). Withings refuses localhost redirects, so it
  sends the browser here, and the person pastes the response back into
  `node sync/withings-authorize.mjs`. This page makes no network request: the
  code never leaves the page except through the clipboard. Plain HTML, inline
  CSS and JS, outside the SPA bundle; Vite copies public/ to dist/ verbatim.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f5;
    --surface: #ffffff;
    --text: #1c1c1e;
    --muted: #4a4a4f;
    --border: #8a8a90;
    --accent: #1f5f99;
    --accent-text: #ffffff;
    --error-bg: #fdecec;
    --error-text: #8a1c1c;
    --focus: #1f5f99;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151517;
      --surface: #1f1f22;
      --text: #f2f2f4;
      --muted: #b9b9c0;
      --border: #7a7a82;
      --accent: #8cc4f5;
      --accent-text: #0d1b28;
      --error-bg: #3a1a1a;
      --error-text: #ffc9c9;
      --focus: #8cc4f5;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px;
    overflow-wrap: anywhere;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 16px;
  }
  h1 { font-size: 1.25rem; margin: 0 0 12px; }
  p { margin: 0 0 12px; color: var(--muted); }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  textarea {
    display: block;
    width: 100%;
    min-height: 7.5em;
    resize: vertical;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    word-break: break-all;
    white-space: pre-wrap;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
  }
  button {
    min-width: 44px;
    min-height: 44px;
    padding: 10px 20px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:focus-visible, textarea:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }
  .hint { margin: 0; color: var(--text); flex: 1 1 12em; }
  .status { min-height: 1.5em; margin: 12px 0 0; color: var(--text); font-weight: 600; }
  .error {
    margin: 0;
    padding: 12px;
    border-radius: 8px;
    background: var(--error-bg);
    color: var(--error-text);
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Withings sign-in</h1>

  <section id="ok" hidden>
    <label for="response">Authorization response</label>
    <textarea id="response" readonly rows="4" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    <div class="actions">
      <button type="button" id="copy">Copy</button>
      <p class="hint">Paste this into the terminal within 30 seconds</p>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </section>

  <section id="failed" hidden>
    <p class="error" id="error" role="alert"></p>
    <p>Run <code>node sync/withings-authorize.mjs</code> again to get a new sign-in link.</p>
  </section>
</main>
<script>
  (function () {
    var query = window.location.search.replace(/^\?/, '');
    var params = new URLSearchParams(query);
    var code = params.get('code');
    var error = params.get('error');

    if (error || !code) {
      var text = error
        ? 'Withings returned an error: ' + error +
          (params.get('error_description') ? ' (' + params.get('error_description') + ')' : '')
        : 'No authorization code in this address';
      document.getElementById('error').textContent = text;
      document.getElementById('failed').hidden = false;
      return;
    }

    var field = document.getElementById('response');
    var button = document.getElementById('copy');
    var status = document.getElementById('status');
    field.value = query;
    document.getElementById('ok').hidden = false;
    button.focus();

    function selectInstead() {
      field.focus();
      field.select();
      field.setSelectionRange(0, field.value.length);
      status.textContent = 'Selected: press Ctrl+C / ⌘C';
    }

    button.addEventListener('click', function () {
      status.textContent = '';
      if (!navigator.clipboard || !navigator.clipboard.writeText) {
        selectInstead();
        return;
      }
      navigator.clipboard.writeText(field.value).then(function () {
        status.textContent = 'Copied';
      }, selectInstead);
    });
  })();
</script>
</body>
</html>
