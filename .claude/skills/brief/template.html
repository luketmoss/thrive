<title>Morning Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;700;800&display=swap">
<style>
/* Layout: one column, summary first. Level badge, recovery tiles, today (events, hourly weather for trails and home), load bars, next 3 days with hourly home weather, body and board. Multi-column from 720px. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --ink: #1b2430;
  --muted: #5d6b7a;
  --line: #d8dee5;
  --accent: #2f6f8f;
  --lvl: #d98a00;
  --lvl-soft: #fbefd2;
  --warn: #b4540a;
  --temp: #c2562b;
  --wind: #3d78a0;
  --rain: #1f8a68;
  --gust: #1b2430;
  --block: #cfd8e3;
  --best: #2f8a5c;
  --bar-easy: #6fae85;
  --bar-med: #e0a23a;
  --bar-hard: #cf5c3f;
  --bar-none: #b9c3ce;
  --display: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171e;
    --surface: #1a232d;
    --ink: #e8edf2;
    --muted: #9aa8b6;
    --line: #2b3745;
    --accent: #6fb4d4;
    --lvl: #f0b43c;
    --lvl-soft: #3a2f14;
    --warn: #f0a068;
    --temp: #f08a5d;
    --wind: #7fb6d6;
    --rain: #5cc9a4;
    --gust: #e8edf2;
    --block: #33465c;
    --best: #5cc08a;
    --bar-easy: #5a9a72;
    --bar-med: #d09a38;
    --bar-hard: #d86b4f;
    --bar-none: #3d4b5a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171e;
  --surface: #1a232d;
  --ink: #e8edf2;
  --muted: #9aa8b6;
  --line: #2b3745;
  --accent: #6fb4d4;
  --lvl: #f0b43c;
  --lvl-soft: #3a2f14;
  --warn: #f0a068;
  --temp: #f08a5d;
  --wind: #7fb6d6;
  --rain: #5cc9a4;
  --gust: #e8edf2;
  --block: #33465c;
  --best: #5cc08a;
  --bar-easy: #5a9a72;
  --bar-med: #d09a38;
  --bar-hard: #d86b4f;
  --bar-none: #3d4b5a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--display); font-size: 15px; line-height: 1.45; padding-inline: 16px; padding-block: 20px 40px; }
.wrap { max-width: 920px; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3, p { margin: 0; text-wrap: balance; }
.label { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.muted { color: var(--muted); }

.date { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.date h1 { font-size: 15px; font-weight: 500; color: var(--muted); }
.hero { background: var(--lvl-soft); border: 1px solid var(--lvl); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.hero .lv { font-size: clamp(40px, 12vw, 64px); font-weight: 800; line-height: 1; letter-spacing: -.02em; color: var(--lvl); }
.hero p { max-width: 64ch; }
.scale { display: flex; gap: 4px; margin-top: 4px; }
.scale span { flex: 1; text-align: center; font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; padding: 4px 0; border-radius: 4px; background: var(--surface); color: var(--muted); border: 1px solid var(--line); }
.scale span.on { background: var(--lvl); color: #1b1300; border-color: var(--lvl); font-weight: 500; }

.sec { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.sec > h2 { font-size: 13px; font-weight: 700; letter-spacing: .02em; }
.grid3 { display: grid; grid-template-columns: 1fr; gap: 10px; }
.tile { display: flex; flex-direction: column; gap: 6px; }
.tile .val { font-size: 28px; font-weight: 700; line-height: 1.1; }
.tile .val small { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 4px; }
.tile .sub { font-size: 12.5px; color: var(--muted); }
.spark { width: 100%; height: 44px; display: block; }
.spark .avg { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; opacity: .7; }
.spark .ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.spark .dot { fill: var(--accent); }

.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 120px; }
.bar { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; height: 100%; min-width: 0; }
.bar .col { width: 100%; border-radius: 4px 4px 0 0; background: var(--bar-none); min-height: 3px; }
.bar .n { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 6px; text-align: center; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.key { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.key i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

.sess { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; justify-content: space-between; }
.sess h3 { font-size: 20px; font-weight: 700; }
.pick { margin-top: 8px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--best); display: flex; flex-direction: column; gap: 2px; }
.pick b { color: var(--best); }
.wx { margin-top: 14px; display: flex; flex-direction: column; gap: 4px; }
.wx .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.wx .hd b { font-size: 14px; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--mono); font-size: 9.5px; fill: var(--muted); }
.chart .tv { fill: var(--temp); font-weight: 500; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .tl { fill: none; stroke: var(--temp); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.chart .td { fill: var(--temp); }
.chart .wb { fill: var(--wind); opacity: .85; }
.chart .gk { stroke: var(--gust); stroke-width: 1.5; }
.chart .blk { fill: var(--block); opacity: .7; }
.chart .bst { fill: none; stroke: var(--best); stroke-width: 1.5; stroke-dasharray: 4 3; }
.sun { display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.sun .ic { width: 18px; height: 18px; fill: none; stroke: var(--lvl); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; margin-left: 8px; }
.sun .ic:first-child { margin-left: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.legend i { display: inline-block; vertical-align: middle; margin-right: 5px; }
.legend .l1 { width: 14px; height: 2px; background: var(--temp); }
.legend .l2 { width: 9px; height: 9px; background: var(--wind); opacity: .85; }
.legend .l3 { width: 2px; height: 9px; background: var(--gust); }
.legend .l4 { width: 12px; height: 9px; background: var(--block); }
.legend .l5 { width: 12px; height: 9px; border: 1.5px dashed var(--best); }
.chart .wv { fill: var(--wind); font-weight: 500; font-size: 11px; }
.chart .rv { fill: var(--rain); font-weight: 500; font-size: 11px; }

.ev { display: flex; gap: 8px; align-items: baseline; font-size: 13.5px; }
.ev .t { font-family: var(--mono); font-size: 11.5px; color: var(--muted); min-width: 96px; flex: none; }
.ev.plan .t { color: var(--accent); }
.ev span:last-child { min-width: 0; }
.evs { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }
.none { font-size: 13px; color: var(--muted); }
.days4 { display: grid; grid-template-columns: 1fr; gap: 10px; }
.day { display: flex; flex-direction: column; gap: 6px; }
.day .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.day .hd b { font-size: 15px; }
.day .sm { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.row2 { display: grid; grid-template-columns: 1fr; gap: 10px; }
.item { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding-block: 4px; border-top: 1px solid var(--line); }
.item:first-of-type { border-top: 0; }
.pill { font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent); white-space: nowrap; }
.foot { font-size: 12.5px; color: var(--muted); padding-top: 4px; }

@media (min-width: 720px) {
  body { font-size: 16px; }
  .grid3 { grid-template-columns: repeat(3, 1fr); }
  .days4 { grid-template-columns: repeat(3, 1fr); }
  .row2 { grid-template-columns: 1fr 1fr; }
  .today-wx { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
}

/* Level colors. The hero reads --lvl; each level sets it. */
:root { --lv-rest: #4f6f8f; --lv-easy: #3f8a5c; --lv-mod: #d98a00; --lv-hard: #c4472b; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --lv-rest: #8fb0d0; --lv-easy: #6fcf94; --lv-mod: #f0b43c; --lv-hard: #f08a6b; }
  :root:not([data-theme="light"]) .hero[data-level="Rest"] .scale .on, :root:not([data-theme="light"]) .hero[data-level="Hard"] .scale .on { color: #1b1300; }
}
:root[data-theme="dark"] { --lv-rest: #8fb0d0; --lv-easy: #6fcf94; --lv-mod: #f0b43c; --lv-hard: #f08a6b; }
:root[data-theme="dark"] .hero[data-level="Rest"] .scale .on, :root[data-theme="dark"] .hero[data-level="Hard"] .scale .on { color: #1b1300; }
.hero { --lvl: var(--lv-mod); background: color-mix(in srgb, var(--lvl) 14%, var(--surface)); }
.hero[data-level="Rest"] { --lvl: var(--lv-rest); }
.hero[data-level="Easy"] { --lvl: var(--lv-easy); }
.hero[data-level="Hard"] { --lvl: var(--lv-hard); }
.hero[data-level="Rest"] .scale .on, .hero[data-level="Hard"] .scale .on { color: #fff; }
</style>

<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  var D = JSON.parse(document.getElementById("brief-data").textContent);
  var root = document.getElementById("root");
  var UP = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18M7 18a5 5 0 0 1 10 0M12 3v6M9.5 5.5 12 3l2.5 2.5"/></svg>';
  var DN = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18M7 18a5 5 0 0 1 10 0M12 9V3M9.5 6.5 12 9l2.5-2.5"/></svg>';

  function el(tag, cls, text, kids) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    (kids || []).forEach(function (k) { if (k) e.appendChild(k); });
    return e;
  }
  function svg(cls, vb, label) {
    var s = document.createElementNS(NS, "svg");
    s.setAttribute("class", cls);
    s.setAttribute("viewBox", vb);
    s.setAttribute("role", "img");
    s.setAttribute("aria-label", label || "");
    return s;
  }
  function sec(title, note) {
    var h = el("h2", null, title);
    if (note) { var n = el("span", "label", note); n.style.marginLeft = "6px"; h.appendChild(n); }
    return el("div", "sec", null, [h]);
  }
  function small(text) {
    var p = el("p", "muted", text);
    p.style.cssText = "margin-top:8px;font-size:13px";
    return p;
  }

  function spark(vals, avgVals, label) {
    var s = svg("spark", "0 0 120 44", label);
    s.setAttribute("preserveAspectRatio", "none");
    var W = 120, H = 44, pad = 6, base = avgVals || vals;
    var avg = base.reduce(function (a, b) { return a + b; }, 0) / base.length;
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), span = Math.max(hi - lo, 1);
    function x(i) { return pad + i * ((W - 2 * pad) / Math.max(vals.length - 1, 1)); }
    function y(v) { return H - pad - ((v - lo) / span) * (H - 2 * pad); }
    var pts = vals.map(function (v, i) { return x(i).toFixed(1) + "," + y(v).toFixed(1); }).join(" ");
    var last = vals.length - 1;
    s.innerHTML =
      '<line class="avg" x1="0" x2="' + W + '" y1="' + y(avg).toFixed(1) + '" y2="' + y(avg).toFixed(1) + '"/>' +
      '<polyline class="ln" points="' + pts + '"/>' +
      '<circle class="dot" cx="' + x(last).toFixed(1) + '" cy="' + y(vals[last]).toFixed(1) + '" r="2.8"/>';
    return s;
  }

  // Hourly chart, 7 AM to 6 PM: T temperature (line), W sustained wind and R rain chance (numbers every 2 hours).
  var H0 = 7, H1 = 18, VBW = 360, PL = 16, PR = 16, COLS = [7, 9, 11, 13, 15, 17];
  var SLOT = (VBW - PL - PR) / (H1 - H0);
  function hx(t) { return PL + (t - H0) * SLOT; }
  function ty(t) { return 96 - (t - 40) / 55 * 80; }
  function hlab(h) { return h === 12 ? "12p" : h > 12 ? (h - 12) + "p" : h + "a"; }
  function chart(c, label) {
    var s = svg("chart", "0 0 360 180", label), h = "", BOT = 164;
    (c.blocks || []).forEach(function (b) {
      var a = Math.max(b[0], H0), z = Math.min(b[1], H1 + 0.6);
      if (z > a) h += '<rect class="blk" x="' + hx(a).toFixed(1) + '" y="4" width="' + (hx(z) - hx(a)).toFixed(1) + '" height="' + (BOT - 4) + '" rx="3"/>';
    });
    if (c.best) h += '<rect class="bst" x="' + hx(c.best[0]).toFixed(1) + '" y="4" width="' + (hx(c.best[1]) - hx(c.best[0])).toFixed(1) + '" height="' + (BOT - 4) + '" rx="4"/>';
    h += '<polyline class="tl" points="' + c.T.map(function (t, i) { return hx(H0 + i).toFixed(1) + "," + ty(t).toFixed(1); }).join(" ") + '"/>';
    c.T.forEach(function (t, i) {
      var hr = H0 + i, on = COLS.indexOf(hr) >= 0;
      h += '<circle class="td" cx="' + hx(hr).toFixed(1) + '" cy="' + ty(t).toFixed(1) + '" r="' + (on ? 3 : 1.8) + '"/>';
      if (on) h += '<text class="tv" x="' + hx(hr).toFixed(1) + '" y="' + (ty(t) - 8).toFixed(1) + '" text-anchor="middle">' + Math.round(t) + '</text>';
    });
    COLS.forEach(function (k) {
      var i = k - H0;
      h += '<text class="wv" x="' + hx(k).toFixed(1) + '" y="127" text-anchor="middle">' + Math.round(c.W[i]) + '</text>';
      h += '<text class="rv" x="' + hx(k).toFixed(1) + '" y="147" text-anchor="middle">' + Math.round(c.R[i]) + '%</text>';
      h += '<text x="' + hx(k).toFixed(1) + '" y="' + (BOT + 12) + '" text-anchor="middle">' + hlab(k) + '</text>';
    });
    s.innerHTML = h;
    return s;
  }
  function sun(sr, ss) {
    var s = el("span", "sun");
    s.setAttribute("aria-label", "Sunrise " + sr + ", sunset " + ss);
    s.innerHTML = UP;
    s.appendChild(document.createTextNode(sr + " "));
    var d = document.createElement("span");
    d.innerHTML = DN;
    s.appendChild(d.firstChild);
    s.appendChild(document.createTextNode(ss));
    return s;
  }
  function ev(e) { return el("div", "ev" + (e.plan ? " plan" : ""), null, [el("span", "t", e.t), el("span", null, e.title)]); }

  root.appendChild(el("div", "date", null, [el("h1", null, D.date), el("span", "label", D.sources || "Thrive · Hive · Calendar · Open-Meteo")]));

  var hero = el("div", "hero", null, [el("div", "lv", D.level), el("p", null, D.levelNote)]);
  hero.setAttribute("data-level", D.level);
  var sc = el("div", "scale");
  ["Rest", "Easy", "Moderate", "Hard"].forEach(function (l) { sc.appendChild(el("span", l === D.level ? "on" : "", l)); });
  hero.appendChild(sc);
  root.appendChild(hero);
  if (D.notice) root.appendChild(el("div", "notice", null, [el("p", null, D.notice)]));

  if (D.recovery) {
    var rs = sec("Last night", "dashed line is the average");
    var g = el("div", "grid3");
    ["sleep", "hrv", "rhr"].forEach(function (k) {
      var r = D.recovery[k];
      if (!r) return;
      var val = el("div", "val num" + (r.value == null ? " na" : ""), r.value == null ? "not synced" : r.value);
      if (r.unit && r.value != null) val.appendChild(el("small", null, r.unit));
      var t = el("div", "card tile", null, [el("span", "label", r.label), val]);
      if (r.series && r.series.length > 1) t.appendChild(spark(r.series, r.series.slice(0, r.avgOf || r.series.length), r.label + " over recent nights"));
      if (r.sub) t.appendChild(el("span", "sub", r.sub));
      g.appendChild(t);
    });
    rs.appendChild(g);
    root.appendChild(rs);
  }

  if (D.today) {
    var T = D.today, ts = sec("Today"), card = el("div", "card");
    (T.sessions || []).forEach(function (s) {
      card.appendChild(el("div", "sess", null, [el("h3", null, s.name), el("span", "label", s.note || "")]));
    });
    var wx = el("div", "today-wx");
    (T.weather || []).forEach(function (w) {
      var hd = el("div", "hd", null, [el("b", null, w.place)]);
      if (w.sunrise) hd.appendChild(sun(w.sunrise, w.sunset));
      wx.appendChild(el("div", "wx", null, [hd, chart(w, "Hourly weather at " + w.place)]));
    });
    card.appendChild(wx);
    if (T.legend) {
      var lg = el("div", "legend");
      if (T.legend.best) lg.appendChild(el("span", null, T.legend.best, [el("i", "l5")]));
      if (T.legend.calendar) lg.appendChild(el("span", null, T.legend.calendar, [el("i", "l4")]));
      card.appendChild(lg);
    }
    if (T.note) card.appendChild(small(T.note));
    if (T.events && T.events.length) card.appendChild(el("div", "evs", null, T.events.map(ev)));
    ts.appendChild(card);
    root.appendChild(ts);
  }

  if (D.load) {
    var ls = sec("Last 7 days", "training load"), lc = el("div", "card");
    var bars = el("div", "bars"), labs = el("div", "days");
    var mx = Math.max.apply(null, [50].concat(D.load.map(function (o) { return o.load; })));
    var col = { easy: "var(--bar-easy)", med: "var(--bar-med)", hard: "var(--bar-hard)", none: "var(--bar-none)" };
    D.load.forEach(function (o) {
      var c = el("div", "col");
      c.style.height = Math.round(o.load / mx * 92) + "px";
      c.style.background = col[o.e] || col.none;
      bars.appendChild(el("div", "bar", null, [el("span", "n", String(o.load)), c]));
      labs.appendChild(el("span", null, o.d));
    });
    var key = el("div", "key");
    [["easy", "Easy"], ["med", "Medium"], ["hard", "Hard"], ["none", "No session logged"]].forEach(function (k) {
      var i = el("i");
      i.style.background = col[k[0]];
      var sp = el("span", null, null, [i]);
      sp.appendChild(document.createTextNode(k[1]));
      key.appendChild(sp);
    });
    lc.appendChild(bars);
    lc.appendChild(labs);
    lc.appendChild(key);
    if (D.loadNote) lc.appendChild(small(D.loadNote));
    ls.appendChild(lc);
    root.appendChild(ls);
  }

  if (D.days && D.days.length) {
    var ds = sec("Next " + D.days.length + " days", D.daysNote || "home weather, daylight hours");
    var dg = el("div", "days4");
    D.days.forEach(function (d) {
      var c = el("div", "card day", null, [el("div", "hd", null, [el("b", null, d.name), el("span", "sm", d.sm || "")])]);
      (d.charts || []).forEach(function (ch) {
        if (ch.place) c.appendChild(el("span", "label", ch.place));
        c.appendChild(chart(ch, "Hourly weather " + d.name + (ch.place ? " at " + ch.place : "")));
      });
      (d.events || []).forEach(function (e) { c.appendChild(ev(e)); });
      if (d.empty) c.appendChild(el("p", "none", d.empty));
      dg.appendChild(c);
    });
    ds.appendChild(dg);
    root.appendChild(ds);
  }

  function item(o, pill) {
    var name = el("span", null, o.title);
    name.appendChild(document.createTextNode(" "));
    name.appendChild(el("span", "label", o.board));
    return el("div", "item", null, [name, el("span", "pill", pill)]);
  }
  if (D.board || D.body) {
    var row = el("div", "row2");
    if (D.board) {
      var bs = sec("Board", "Hive"), bc = el("div", "card");
      if (D.board.overdue && D.board.overdue.length) {
        bc.appendChild(el("span", "label", "Overdue"));
        D.board.overdue.forEach(function (o) { bc.appendChild(item(o, o.days)); });
      }
      if (D.board.today && D.board.today.length) {
        bc.appendChild(el("span", "label", "Due today"));
        D.board.today.forEach(function (o) { bc.appendChild(item(o, o.status)); });
      }
      if (D.board.note) {
        var bn = el("p", "none", D.board.note);
        bn.style.marginTop = "6px";
        bc.appendChild(bn);
      }
      bs.appendChild(bc);
      row.appendChild(bs);
    }
    if (D.body) {
      var ys = sec("Body"), yc = el("div", "card tile", null, [el("span", "label", D.body.label || "Weight, lb"), el("div", "val num", D.body.value)]);
      if (D.body.series && D.body.series.length > 1) yc.appendChild(spark(D.body.series, null, "Weight readings"));
      if (D.body.sub) yc.appendChild(el("span", "sub", D.body.sub));
      ys.appendChild(yc);
      row.appendChild(ys);
    }
    root.appendChild(row);
  }

  if (D.foot) root.appendChild(el("p", "foot", D.foot));
})();
</script>
